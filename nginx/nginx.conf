user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log notice;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 로그 포맷 설정 (리눅스 실습 시 로그 확인용)
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # 실제 서버 설정
    server {
        listen       80;
        server_name  localhost; # 도메인 이름(나중에 수정)

        # 1. 프론트엔드 정적 파일 서빙 (HTML, CSS, JS)
        location / {
            root   /usr/share/nginx/html; # nginx 컨테이너 내의 정적 파일 위치
            index  Login.html Login.htm; # 기본적으로 Login.html을 먼저 찾고, 없으면 Login.htm을 찾음
            try_files $uri $uri/ /Project.html; # 찾을 수 없는 파일일때 Project.html로 리다이렉트
        }

        # 2. API 서버로 요청 전달 (리버스 프록시)
        # 브라우저에서 도메인/api/... 로 오는 요청을 api 컨테이너의 8000포트로 넘김
        location /api/ {
            # 여기서 'api'는 docker-compose에 정의한 서비스 이름입니다.
            proxy_pass http://api:8000/; 
            
            # 리눅스 네트워크 헤더 전달 설정 (보안 및 분석용)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # 에러 페이지 설정
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}

