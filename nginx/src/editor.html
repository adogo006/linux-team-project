<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>에디터 — CodeSync</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/editor.css" />
  </head>
  <body>
    <!-- 상단 네비게이션 -->
    <nav class="editor-nav">
      <div class="nav-logo">CodeSync</div>
      <span class="nav-sep">/</span>
      <button type="button" class="nav-project-name" id="nav-project-name">
        프로젝트명
      </button>
      <span class="nav-role-badge" id="nav-role-badge"></span>
      <div class="nav-spacer"></div>
      <button class="nav-back" onclick="window.location.href = 'project.html'">
        프로젝트 목록
      </button>
      <button class="nav-logout" onclick="handleLogout()">로그아웃</button>
    </nav>

    <!-- 3단 레이아웃 -->
    <div class="editor-layout">
      <!-- 왼쪽: 파일 트리 -->
      <aside class="panel-files">
        <div class="files-header">
          <span>파일</span>
        </div>
        <div class="file-tree" id="file-tree"></div>
      </aside>

      <!-- 가운데: 코드 에디터 -->
      <section class="panel-editor">
        <div class="editor-tabs" id="editor-tabs"></div>
        <div class="editor-toolbar" id="editor-toolbar"></div>
        <div class="code-area" id="code-area">
          <div class="code-empty">
            <span class="icon">{'_'}</span>
            <span>파일을 선택하면 코드가 표시됩니다</span>
          </div>
        </div>
      </section>

      <!-- 오른쪽: 사용자 목록 -->
      <aside class="panel-users">
        <div class="panel-header">
          <span>멤버</span>
          <span class="online-dot"></span>
        </div>
        <div class="user-list" id="user-list"></div>

        <!-- 프로젝트장 전용 하단 버튼 -->
        <div class="panel-bottom" id="panel-bottom">
          <button class="btn-invite" onclick="openInviteModal()">
            + 사용자 초대
          </button>
          <button class="btn-danger" onclick="openDeleteModal()">
            ⚠ 프로젝트 삭제
          </button>
        </div>
      </aside>
    </div>

    <!-- 수정 로그 패널 -->
    <div class="log-overlay" id="log-overlay" onclick="handleLogOverlay(event)">
      <div class="log-backdrop"></div>
      <div class="log-panel">
        <div class="log-panel-header">
          <div class="log-panel-title" id="log-title">수정 로그</div>
          <button class="log-close" onclick="closeLogPanel()">✕</button>
        </div>
        <div class="log-content" id="log-content"></div>
      </div>
    </div>

    <!-- 사용자 초대 모달 -->
    <div
      class="invite-modal-overlay"
      id="invite-overlay"
      onclick="handleInviteOverlay(event)"
    >
      <div class="invite-modal">
        <div class="invite-modal-corner"></div>
        <div class="invite-modal-title">사용자 초대<span>_</span></div>
        <div class="invite-modal-sub">// 닉네임으로 초대를 보냅니다</div>

        <label class="invite-input-label">닉네임</label>
        <input
          class="invite-input"
          id="invite-nickname-input"
          type="text"
          placeholder="초대할 사용자의 닉네임"
          oninput="validateInviteNickname()"
          autocomplete="off"
        />
        <div class="invite-hint info" id="invite-hint"></div>

        <div class="invite-modal-actions">
          <button class="btn-cancel-modal" onclick="closeInviteModal()">
            취소
          </button>
          <button
            class="btn-invite-send"
            id="btn-invite-send"
            onclick="sendInvite()"
            disabled
          >
            초대 보내기
          </button>
        </div>
      </div>
    </div>

    <!-- 공통 작업 모달 (이름 변경/삭제 확인/알림) -->
    <div
      class="invite-modal-overlay"
      id="action-overlay"
      onclick="handleActionOverlay(event)"
    >
      <div class="invite-modal action-modal">
        <div class="invite-modal-corner"></div>
        <div class="invite-modal-title" id="action-title">작업</div>
        <div class="invite-modal-sub" id="action-sub"></div>

        <label class="invite-input-label" id="action-input-label">입력</label>
        <input
          class="invite-input"
          id="action-input"
          type="text"
          autocomplete="off"
          onkeydown="handleActionInputKeydown(event)"
        />
        <div class="invite-hint info" id="action-hint"></div>

        <div class="invite-modal-actions">
          <button class="btn-cancel-modal" id="btn-action-cancel" onclick="closeActionModal(false)">
            취소
          </button>
          <button class="btn-invite-send" id="btn-action-confirm" onclick="confirmActionModal()">
            확인
          </button>
        </div>
      </div>
    </div>

    <!-- 프로젝트 삭제 모달 -->
    <div
      class="modal-overlay"
      id="delete-overlay"
      onclick="handleDeleteOverlay(event)"
    >
      <div class="modal">
        <div class="modal-title">⚠ 프로젝트 삭제</div>
        <div class="modal-desc">
          이 작업은 <strong>되돌릴 수 없습니다.</strong><br />
          모든 파일, 코드, 멤버 정보가 영구적으로 삭제됩니다.
        </div>
        <div class="modal-confirm-label">
          확인을 위해 <code>삭제</code> 를 입력하세요
        </div>
        <input
          class="modal-input"
          id="delete-input"
          type="text"
          placeholder="삭제"
          autocomplete="off"
        />
        <div class="modal-actions">
          <button class="btn-cancel-modal" onclick="closeDeleteModal()">
            취소
          </button>
          <button
            class="btn-delete-confirm"
            id="btn-delete-confirm"
            onclick="confirmDelete()"
          >
            영구 삭제
          </button>
        </div>
      </div>
    </div>

    <script src="js/editor.js"></script>
  </body>
</html>
