<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>로그인 — CodeSync</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/login.css" />
  </head>
  <body>
    <div class="card">
      <div class="corner"></div>
      <div class="logo">CodeSync</div>
      <h1>로그인<span>_</span></h1>
      <div class="divider"></div>

      <div class="field">
        <label>아이디</label>
        <input
          type="text"
          id="login-id"
          placeholder="아이디를 입력하세요"
          autocomplete="username"
        />
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input
          type="password"
          id="login-pw"
          placeholder="비밀번호를 입력하세요"
          autocomplete="current-password"
        />
      </div>

      <div class="btn-row">
        <button class="btn btn-login" onclick="handleLogin()">로그인</button>
        <button class="btn btn-register" onclick="goRegister()">
          회원가입
        </button>
      </div>

      <div class="status" id="login-status"></div>
    </div>

    <script src="js/login.js"></script>
  </body>
</html>
