<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>로그인 — CodeSync</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@300;400;500;600&display=swap" rel="stylesheet"/>
  <style>
    :root {
      --bg: #0d0f14;
      --surface: #161920;
      --surface2: #1e2229;
      --border: #2a2f3a;
      --text: #e8eaf0;
      --text-muted: #6b7280;
      --green: #22c55e;
      --green-dark: #16a34a;
      --blue: #3b82f6;
      --blue-dark: #2563eb;
      --accent: #22c55e;
      --font-mono: 'JetBrains Mono', monospace;
      --font-body: 'Pretendard', sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Grid background */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 40px 40px;
      opacity: 0.3;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 50%, rgba(34,197,94,0.05) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 40px 36px 36px;
      width: 380px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.6), 0 0 0 1px rgba(255,255,255,0.03) inset;
      animation: fadeUp 0.5s ease both;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* Header */
    .logo {
      font-family: var(--font-mono);
      font-size: 11px;
      font-weight: 600;
      color: var(--green);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .logo::before { content: '> '; opacity: 0.6; }

    h1 {
      font-family: var(--font-mono);
      font-size: 22px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 28px;
      line-height: 1.2;
    }
    h1 span { color: var(--green); }

    /* Divider */
    .divider {
      height: 1px;
      background: var(--border);
      margin-bottom: 24px;
    }

    /* Input group */
    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 6px;
      font-family: var(--font-mono);
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 7px;
      padding: 11px 14px;
      font-family: var(--font-mono);
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 0 3px rgba(34,197,94,0.1);
    }

    input::placeholder { color: var(--text-muted); }

    /* Button row */
    .btn-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      height: 46px;
      border: none;
      border-radius: 8px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-body);
      cursor: pointer;
      transition: filter 0.15s, transform 0.1s;
      letter-spacing: 0.01em;
    }

    .btn:active { transform: scale(0.97); }
    .btn:hover { filter: brightness(1.1); }

    .btn-login {
      background: var(--green);
      color: #fff;
      box-shadow: 0 4px 16px rgba(34,197,94,0.25);
    }

    .btn-register {
      background: var(--blue);
      color: #fff;
      box-shadow: 0 4px 16px rgba(59,130,246,0.25);
    }

    /* Status message */
    .status {
      margin-top: 12px;
      font-size: 12px;
      color: var(--text-muted);
      font-family: var(--font-mono);
      min-height: 16px;
      text-align: center;
    }
    .status.error { color: #f87171; }
    .status.success { color: var(--green); }

    /* Corner accent */
    .corner {
      position: absolute;
      top: 0; right: 0;
      width: 60px; height: 60px;
      border-top: 2px solid var(--green);
      border-right: 2px solid var(--green);
      border-radius: 0 12px 0 0;
      opacity: 0.4;
    }
  </style>
</head>
<body>

<div class="card">
  <div class="corner"></div>
  <div class="logo">CodeSync</div>
  <h1>로그인<span>_</span></h1>
  <div class="divider"></div>

  <div class="field">
    <label>아이디</label>
    <input type="text" id="login-id" placeholder="아이디를 입력하세요" autocomplete="username"/>
  </div>

  <div class="field">
    <label>비밀번호</label>
    <input type="password" id="login-pw" placeholder="비밀번호를 입력하세요" autocomplete="current-password"/>
  </div>

  <div class="btn-row">
    <button class="btn btn-login" onclick="handleLogin()">로그인</button>
    <button class="btn btn-register" onclick="goRegister()">회원가입</button>
  </div>

  <div class="status" id="login-status"></div>
</div>

<script>
  async function handleLogin() {
    const id = document.getElementById('login-id').value.trim();
    const pw = document.getElementById('login-pw').value;
    const status = document.getElementById('login-status');

    if (!id || !pw) {
      status.textContent = '아이디와 비밀번호를 입력해주세요.';
      status.className = 'status error';
      return;
    }

    status.textContent = '로그인 중...';
    status.className = 'status';

    try {
      // TODO: API URL 확정되면 교체
      const API_URL = 'http://YOUR_API_URL/api/auth/login';

      const res = await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: id, password: pw })
      });

      const data = await res.json();

      if (res.ok) {
        status.textContent = '✓ 로그인 성공';
        status.className = 'status success';
        // TODO: 로그인 후 이동할 페이지 경로로 교체
        // window.location.href = '/editor';
      } else {
        status.textContent = data.message || '아이디 또는 비밀번호가 올바르지 않습니다.';
        status.className = 'status error';
      }
    } catch (e) {
      // 개발 중 API 없을 때 Mock 처리
      status.textContent = '[DEV] API 미연결 상태입니다.';
      status.className = 'status error';
    }
  }

  function goRegister() {
    window.location.href = 'register.html';
  }

  // Enter 키 로그인
  document.addEventListener('keydown', e => {
    if (e.key === 'Enter') handleLogin();
  });
</script>
</body>
</html>
