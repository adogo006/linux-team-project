<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 — CodeSync</title>
    <link rel="stylesheet" href="css/common.css" />
    <link rel="stylesheet" href="css/register.css" />
  </head>
  <body>
    <!-- FOUC 방지 -->
    <script>
      if (localStorage.getItem("theme") === "light")
        document.body.classList.add("light");
    </script>

    <!-- 테마 토글 (우측 상단 fixed) -->
    <button
      class="theme-toggle theme-toggle-fixed"
      onclick="toggleTheme()"
      title="테마 전환"
    >
      <div class="theme-toggle-inner">
        <span class="theme-dot dark-dot"></span>
        <span class="theme-dot light-dot"></span>
      </div>
    </button>

    <div class="card">
      <div class="corner"></div>
      <div class="logo">CodeSync</div>
      <h1>회원가입<span>_</span></h1>
      <div class="divider"></div>

      <div class="section-label">프로필</div>

      <div class="field">
        <label>닉네임</label>
        <div class="input-row">
          <input
            type="text"
            id="nickname"
            placeholder="한글, 영문, 숫자 (2~12자)"
            oninput="validateField('nickname')"
          />
          <button
            class="btn-check"
            id="nickname-btn"
            onclick="checkDuplicate('nickname')"
            disabled
          >
            중복 확인
          </button>
        </div>
        <div class="hint info" id="nickname-hint">
          한글, 영문, 숫자 (2~12자)
        </div>
      </div>

      <div class="section-label">계정</div>

      <div class="field">
        <label>아이디</label>
        <div class="input-row">
          <input
            type="text"
            id="username"
            placeholder="영문, 숫자 (2~12자)"
            oninput="validateField('username')"
          />
          <button
            class="btn-check"
            id="username-btn"
            onclick="checkDuplicate('username')"
            disabled
          >
            중복 확인
          </button>
        </div>
        <div class="hint info" id="username-hint">영문, 숫자 (2~12자)</div>
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="영문, 숫자, 특수문자 포함 8자 이상"
          oninput="checkPassword()"
        />
        <div class="hint info" id="pw-hint">
          영문, 숫자, 특수문자 포함 8자 이상
        </div>
      </div>

      <div class="field">
        <label>비밀번호 확인</label>
        <input
          type="password"
          id="password-confirm"
          placeholder="비밀번호 재입력"
          oninput="checkConfirm()"
        />
        <div class="pw-match">
          <div class="pw-match-fill" id="pw-match-fill"></div>
        </div>
        <div class="hint info" id="pw-match-hint"></div>
      </div>

      <button
        class="btn-submit"
        id="submit-btn"
        onclick="handleRegister()"
        disabled
      >
        회원가입 완료
      </button>
      <div class="status" id="reg-status"></div>
      <span class="back-link" onclick="goLogin()">로그인으로 돌아가기</span>
    </div>

    <script src="js/theme.js"></script>
    <script src="js/register.js"></script>
  </body>
</html>
