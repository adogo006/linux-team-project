<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>회원가입 — CodeSync</title>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Pretendard:wght@300;400;500;600&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #0d0f14;
        --surface: #161920;
        --surface2: #1e2229;
        --border: #2a2f3a;
        --text: #e8eaf0;
        --text-muted: #6b7280;
        --green: #22c55e;
        --blue: #3b82f6;
        --red: #f87171;
        --yellow: #facc15;
        --font-mono: "JetBrains Mono", monospace;
        --font-body: "Pretendard", sans-serif;
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        background: var(--bg);
        color: var(--text);
        font-family: var(--font-body);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 32px 16px;
        overflow-x: hidden;
      }

      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          linear-gradient(var(--border) 1px, transparent 1px),
          linear-gradient(90deg, var(--border) 1px, transparent 1px);
        background-size: 40px 40px;
        opacity: 0.3;
        pointer-events: none;
      }

      body::after {
        content: "";
        position: fixed;
        inset: 0;
        background: radial-gradient(
          ellipse 60% 60% at 50% 50%,
          rgba(59, 130, 246, 0.05) 0%,
          transparent 70%
        );
        pointer-events: none;
      }

      .card {
        position: relative;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 40px 36px 36px;
        width: 420px;
        box-shadow:
          0 24px 64px rgba(0, 0, 0, 0.6),
          0 0 0 1px rgba(255, 255, 255, 0.03) inset;
        animation: fadeUp 0.5s ease both;
      }

      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(20px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .logo {
        font-family: var(--font-mono);
        font-size: 11px;
        font-weight: 600;
        color: var(--blue);
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 6px;
      }
      .logo::before {
        content: "> ";
        opacity: 0.6;
      }

      h1 {
        font-family: var(--font-mono);
        font-size: 22px;
        font-weight: 700;
        color: var(--text);
        margin-bottom: 28px;
      }
      h1 span {
        color: var(--blue);
      }

      .divider {
        height: 1px;
        background: var(--border);
        margin-bottom: 24px;
      }

      /* Section label */
      .section-label {
        font-family: var(--font-mono);
        font-size: 10px;
        color: var(--text-muted);
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-bottom: 14px;
        margin-top: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .section-label::after {
        content: "";
        flex: 1;
        height: 1px;
        background: var(--border);
      }
      .section-label:first-of-type {
        margin-top: 0;
      }

      .field {
        margin-bottom: 14px;
      }

      label {
        display: block;
        font-size: 11px;
        font-weight: 600;
        color: var(--text-muted);
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 6px;
        font-family: var(--font-mono);
      }

      /* Input + button inline row */
      .input-row {
        display: flex;
        gap: 8px;
      }

      .input-row input {
        flex: 1;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 7px;
        padding: 11px 14px;
        font-family: var(--font-mono);
        font-size: 14px;
        color: var(--text);
        outline: none;
        transition:
          border-color 0.2s,
          box-shadow 0.2s;
      }

      input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
      }

      input.valid {
        border-color: var(--green);
        box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.08);
      }

      input.invalid {
        border-color: var(--red);
        box-shadow: 0 0 0 3px rgba(248, 113, 113, 0.08);
      }

      input::placeholder {
        color: var(--text-muted);
      }

      /* Check button */
      .btn-check {
        flex-shrink: 0;
        padding: 0 14px;
        height: 42px;
        background: var(--surface2);
        border: 1px solid var(--border);
        border-radius: 7px;
        font-size: 12px;
        font-family: var(--font-mono);
        font-weight: 600;
        color: var(--text-muted);
        cursor: pointer;
        transition: all 0.15s;
        white-space: nowrap;
      }
      .btn-check:hover {
        border-color: var(--blue);
        color: var(--blue);
      }
      .btn-check:active {
        transform: scale(0.97);
      }

      /* Inline hint */
      .hint {
        font-size: 11px;
        font-family: var(--font-mono);
        margin-top: 5px;
        min-height: 14px;
        padding-left: 2px;
        transition: color 0.2s;
      }
      .hint.ok {
        color: var(--green);
      }
      .hint.fail {
        color: var(--red);
      }
      .hint.info {
        color: var(--text-muted);
      }

      /* PW match bar */
      .pw-match {
        height: 3px;
        border-radius: 2px;
        margin-top: 6px;
        background: var(--border);
        overflow: hidden;
      }
      .pw-match-fill {
        height: 100%;
        width: 0%;
        border-radius: 2px;
        transition:
          width 0.3s,
          background 0.3s;
      }

      /* Submit button */
      .btn-submit {
        width: 100%;
        height: 48px;
        background: var(--blue);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 15px;
        font-weight: 600;
        font-family: var(--font-body);
        cursor: pointer;
        margin-top: 24px;
        box-shadow: 0 4px 16px rgba(59, 130, 246, 0.25);
        transition:
          filter 0.15s,
          transform 0.1s;
        letter-spacing: 0.01em;
      }
      .btn-submit:hover {
        filter: brightness(1.1);
      }
      .btn-submit:active {
        transform: scale(0.98);
      }
      .btn-submit:disabled {
        opacity: 0.45;
        cursor: not-allowed;
        filter: none;
      }

      /* Back link */
      .back-link {
        display: block;
        text-align: center;
        margin-top: 16px;
        font-size: 12px;
        font-family: var(--font-mono);
        color: var(--text-muted);
        cursor: pointer;
        transition: color 0.15s;
      }
      .back-link:hover {
        color: var(--blue);
      }
      .back-link::before {
        content: "← ";
      }

      .status {
        margin-top: 10px;
        font-size: 12px;
        color: var(--text-muted);
        font-family: var(--font-mono);
        min-height: 16px;
        text-align: center;
      }
      .status.error {
        color: var(--red);
      }
      .status.success {
        color: var(--green);
      }

      .corner {
        position: absolute;
        top: 0;
        right: 0;
        width: 60px;
        height: 60px;
        border-top: 2px solid var(--blue);
        border-right: 2px solid var(--blue);
        border-radius: 0 12px 0 0;
        opacity: 0.4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="corner"></div>
      <div class="logo">CodeSync</div>
      <h1>회원가입<span>_</span></h1>
      <div class="divider"></div>

      <!-- 닉네임 -->
      <div class="section-label">프로필</div>

      <div class="field">
        <label>닉네임</label>
        <div class="input-row">
          <input
            type="text"
            id="nickname"
            placeholder="사용할 닉네임"
            oninput="resetCheck('nickname')"
          />
          <button class="btn-check" onclick="checkDuplicate('nickname')">
            중복 확인
          </button>
        </div>
        <div class="hint info" id="nickname-hint">한글/영문 2~12자</div>
      </div>

      <!-- 아이디 -->
      <div class="section-label">계정</div>

      <div class="field">
        <label>아이디</label>
        <div class="input-row">
          <input
            type="text"
            id="username"
            placeholder="사용할 아이디"
            oninput="resetCheck('username')"
          />
          <button class="btn-check" onclick="checkDuplicate('username')">
            중복 확인
          </button>
        </div>
        <div class="hint info" id="username-hint">영문·숫자 조합 최대 12자</div>
      </div>

      <div class="field">
        <label>비밀번호</label>
        <input
          type="password"
          id="password"
          placeholder="비밀번호 입력"
          oninput="checkPwMatch()"
        />
        <div class="hint info" id="pw-hint">
          영문·숫자·특수문자 포함 8자 이상
        </div>
      </div>

      <div class="field">
        <label>비밀번호 확인</label>
        <input
          type="password"
          id="password-confirm"
          placeholder="비밀번호 재입력"
          oninput="checkPwMatch()"
        />
        <div class="pw-match">
          <div class="pw-match-fill" id="pw-match-fill"></div>
        </div>
        <div class="hint info" id="pw-match-hint"></div>
      </div>

      <button
        class="btn-submit"
        id="submit-btn"
        onclick="handleRegister()"
        disabled
      >
        회원가입 완료
      </button>
      <div class="status" id="reg-status"></div>
      <span class="back-link" onclick="goLogin()">로그인으로 돌아가기</span>
    </div>

    <script>
      // 중복 확인 통과 여부 추적
      const checked = { nickname: false, username: false };
      const pwValid = { match: false };

      function resetCheck(field) {
        checked[field] = false;
        const input = document.getElementById(field);
        input.classList.remove("valid", "invalid");
        document.getElementById(field + "-hint").textContent =
          field === "nickname"
            ? "한글/영문 2~12자"
            : "영문·숫자 조합 최대 12자";
        document.getElementById(field + "-hint").className = "hint info";
        updateSubmitBtn();
      }

      async function checkDuplicate(field) {
        const input = document.getElementById(field);
        const hint = document.getElementById(field + "-hint");
        const value = input.value.trim();

        // 간단한 클라이언트 유효성 검사
        if (field === "nickname" && (value.length < 2 || value.length > 12)) {
          hint.textContent = "닉네임은 2~12자여야 합니다.";
          hint.className = "hint fail";
          input.classList.add("invalid");
          input.classList.remove("valid");
          return;
        }
        if (
          field === "username" &&
          !/^(?=.*[a-zA-Z])(?=.*\d)[a-zA-Z0-9]{1,12}$/.test(value)
        ) {
          hint.textContent = "영문·숫자 조합 최대 12자로 입력해주세요.";
          hint.className = "hint fail";
          input.classList.add("invalid");
          input.classList.remove("valid");
          return;
        }

        hint.textContent = "확인 중...";
        hint.className = "hint info";

        try {
          // TODO: API URL 확정되면 교체
          const API_URL = `http://YOUR_API_URL/api/auth/check-${field}?value=${encodeURIComponent(value)}`;
          const res = await fetch(API_URL);
          const data = await res.json();

          if (data.available) {
            hint.textContent = "✓ 사용 가능합니다.";
            hint.className = "hint ok";
            input.classList.add("valid");
            input.classList.remove("invalid");
            checked[field] = true;
          } else {
            hint.textContent =
              "✗ 이미 사용 중인 " +
              (field === "nickname" ? "닉네임" : "아이디") +
              "입니다.";
            hint.className = "hint fail";
            input.classList.add("invalid");
            input.classList.remove("valid");
            checked[field] = false;
          }
        } catch (e) {
          // 개발 중 Mock 처리 — API 연결 전 임시
          hint.textContent = "[DEV] 사용 가능 (API 미연결)";
          hint.className = "hint ok";
          input.classList.add("valid");
          input.classList.remove("valid");
          checked[field] = true; // DEV 편의상 통과 처리
        }

        updateSubmitBtn();
      }

      function checkPwMatch() {
        const pw = document.getElementById("password").value;
        const pw2 = document.getElementById("password-confirm").value;
        const pwHint = document.getElementById("pw-hint");
        const matchHint = document.getElementById("pw-match-hint");
        const fill = document.getElementById("pw-match-fill");
        const pwInput = document.getElementById("password");
        const pw2Input = document.getElementById("password-confirm");

        // 비밀번호 강도 체크
        const strongPw = /^(?=.*[a-zA-Z])(?=.*\d)(?=.*[!@#$%^&*]).{8,}$/.test(
          pw,
        );
        if (pw.length === 0) {
          pwHint.textContent = "영문·숫자·특수문자 포함 8자 이상";
          pwHint.className = "hint info";
          pwInput.classList.remove("valid", "invalid");
        } else if (strongPw) {
          pwHint.textContent = "✓ 안전한 비밀번호입니다.";
          pwHint.className = "hint ok";
          pwInput.classList.add("valid");
          pwInput.classList.remove("invalid");
        } else {
          pwHint.textContent = "영문·숫자·특수문자를 모두 포함해야 합니다.";
          pwHint.className = "hint fail";
          pwInput.classList.add("invalid");
          pwInput.classList.remove("valid");
        }

        // 비밀번호 일치 확인
        if (pw2.length === 0) {
          fill.style.width = "0%";
          matchHint.textContent = "";
          matchHint.className = "hint info";
          pw2Input.classList.remove("valid", "invalid");
          pwValid.match = false;
        } else if (pw === pw2) {
          fill.style.width = "100%";
          fill.style.background = "#22c55e";
          matchHint.textContent = "✓ 비밀번호가 일치합니다.";
          matchHint.className = "hint ok";
          pw2Input.classList.add("valid");
          pw2Input.classList.remove("invalid");
          pwValid.match = strongPw;
        } else {
          const ratio = Math.min(pw2.length / pw.length, 0.9) * 100;
          fill.style.width = ratio + "%";
          fill.style.background = "#f87171";
          matchHint.textContent = "✗ 비밀번호가 일치하지 않습니다.";
          matchHint.className = "hint fail";
          pw2Input.classList.add("invalid");
          pw2Input.classList.remove("valid");
          pwValid.match = false;
        }

        updateSubmitBtn();
      }

      function updateSubmitBtn() {
        const ready = checked.nickname && checked.username && pwValid.match;
        document.getElementById("submit-btn").disabled = !ready;
      }

      async function handleRegister() {
        const status = document.getElementById("reg-status");
        const body = {
          nickname: document.getElementById("nickname").value.trim(),
          username: document.getElementById("username").value.trim(),
          password: document.getElementById("password").value,
        };

        status.textContent = "처리 중...";
        status.className = "status";

        try {
          // TODO: API URL 확정되면 교체
          const API_URL = "http://YOUR_API_URL/api/auth/register";
          const res = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await res.json();

          if (res.ok) {
            status.textContent = "✓ 회원가입이 완료되었습니다!";
            status.className = "status success";
            setTimeout(goLogin, 1500);
          } else {
            status.textContent = data.message || "회원가입에 실패했습니다.";
            status.className = "status error";
          }
        } catch (e) {
          status.textContent = "[DEV] API 미연결 상태입니다.";
          status.className = "status error";
        }
      }

      function goLogin() {
        window.location.href = "login.html";
      }
    </script>
  </body>
</html>
